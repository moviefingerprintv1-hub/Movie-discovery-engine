<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Discovery Engine</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: auto;
      padding: 20px;
      background: #111;
      color: #eee;
    }

    h1 {
      margin-bottom: 5px;
    }

    .search {
      background: #222;
      padding: 18px;
      border-radius: 12px;
      margin: 20px 0;
    }

    .movie {
      background: #222;
      padding: 18px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .score {
      font-size: 28px;
      font-weight: bold;
    }

    .eligible {
      color: #7ee787;
    }

    .disqualified {
      color: #ff7b72;
    }

    .breakdown {
      margin-top: 10px;
      line-height: 1.7;
    }
  </style>
</head>

<body>

<h1>Movie Discovery Engine</h1>
<p>Prototype 0.1</p>

<div class="search">
  <strong>Benchmark Search #001</strong>

  <p>
    A futuristic movie made after 1995 where the technology,
    architecture and design look like the 1960s, creating a feeling
    of childlike wonder, discovery and experiencing something new.
  </p>
</div>

<div id="results">
  Loading fingerprints...
</div>

<script>

const benchmark = {

  mustHave: {
    future_world: 0.70,
    retrofuturism: 0.70,
    architecture_1960s: 0.70
  },

  weights: {
    future_world: 5,
    retrofuturism: 5,
    architecture_1960s: 4,
    analog_technology: 3,
    wonder: 4,
    discovery: 4,
    childlike_wonder: 5,
    novelty: 5,
    excitement: 3,
    hope: 2
  }
};


function value(movie, attribute) {

  const map = {

    future_world:
      movie.world?.future_world || 0,

    retrofuturism:
      movie.visuals?.retrofuturism || 0,

    architecture_1960s:
      movie.visuals?.["1960s_architecture"] || 0,

    analog_technology:
      movie.visuals?.analog_technology_aesthetic || 0,

    wonder:
      movie.emotion?.wonder || 0,

    discovery:
      movie.emotion?.discovery || 0,

    childlike_wonder:
      movie.emotion?.childlike_wonder || 0,

    novelty:
      movie.emotion?.novelty || 0,

    excitement:
      movie.emotion?.excitement || 0,

    hope:
      movie.emotion?.hope || 0

  };

  return map[attribute] || 0;
}


function scoreMovie(movie) {

  let weightedScore = 0;
  let totalWeight = 0;

  for (const attribute in benchmark.weights) {

    const weight = benchmark.weights[attribute];
    const movieValue = value(movie, attribute);

    weightedScore += movieValue * weight;
    totalWeight += weight;
  }

  const score =
    Math.round((weightedScore / totalWeight) * 100);


  let failedMustHaves = [];

  if (movie.type !== "movie") {
    failedMustHaves.push("Not a movie");
  }

  if (movie.release_year <= 1995) {
    failedMustHaves.push("Made before 1996");
  }

  for (const attribute in benchmark.mustHave) {

    const required =
      benchmark.mustHave[attribute];

    if (value(movie, attribute) < required) {

      failedMustHaves.push(attribute);
    }
  }


  return {
    score,
    eligible: failedMustHaves.length === 0,
    failedMustHaves
  };
}


async function loadMovies() {

  const files = [
    "data/gattaca.json",
    "data/pleasantville.json"
  ];

  const movies = [];

  for (const file of files) {

    const response = await fetch(file);
    const movie = await response.json();

    movies.push(movie);
  }

  return movies;
}


async function runEngine() {

  const movies = await loadMovies();

  const ranked = movies
    .map(movie => ({
      movie,
      result: scoreMovie(movie)
    }))
    .sort((a, b) =>
      b.result.score - a.result.score
    );


  const results =
    document.getElementById("results");

  results.innerHTML = "";


  for (const item of ranked) {

    const movie = item.movie;
    const result = item.result;

    const card =
      document.createElement("div");

    card.className = "movie";

    const status = result.eligible
      ? `<span class="eligible">Precision Match</span>`
      : `<span class="disqualified">Outside Pick</span>`;

    const failed =
      result.failedMustHaves.length
      ? `<p><strong>Failed must-haves:</strong>
         ${result.failedMustHaves.join(", ")}</p>`
      : "";


    card.innerHTML = `

      <h2>${movie.title}</h2>

      <div class="score">
        ${result.score}% match
      </div>

      <p>${status}</p>

      <div class="breakdown">

        Future world:
        ${Math.round(
          value(movie,"future_world") * 100
        )}%

        <br>

        Retrofuturism:
        ${Math.round(
          value(movie,"retrofuturism") * 100
        )}%

        <br>

        1960s architecture:
        ${Math.round(
          value(movie,"architecture_1960s") * 100
        )}%

        <br>

        Wonder:
        ${Math.round(
          value(movie,"wonder") * 100
        )}%

        <br>

        Childlike wonder:
        ${Math.round(
          value(movie,"childlike_wonder") * 100
        )}%

        <br>

        Discovery:
        ${Math.round(
          value(movie,"discovery") * 100
        )}%

      </div>

      ${failed}
    `;

    results.appendChild(card);
  }
}


runEngine();

</script>

</body>
</html>
